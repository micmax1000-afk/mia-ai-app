# Test automatici — Mia AI (servizi esterni simulati, nessuna chiave necessaria)
name: Test

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Test end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Installa dipendenze dei test
        working-directory: tests
        run: npm ci

      - name: Installa Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Esegui i test
        working-directory: tests
        run: npm test

      - name: Salva il registro dei test se falliscono
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-log
          path: tests/*.log
          if-no-files-found: ignore
