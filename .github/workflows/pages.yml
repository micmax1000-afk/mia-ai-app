# Pubblica la versione web di Mia (per PC e tablet) su GitHub Pages.
# Prima volta: Settings → Pages → Build and deployment → Source: «GitHub Actions».
name: Pagina web (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'bridge/**'
      - 'tests/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Prepara i file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepara www/
        run: node scripts/stage-www.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    name: Pubblica
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
