# Build APK — Mia AI (uso personale)
name: Build APK

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Stage web assets (www/)
        run: npm run stage

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Add Capacitor Android + sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Applica icone e schermata di avvio
        run: |
          cp -r resources/android-res/. android/app/src/main/res/
          ls android/app/src/main/res/mipmap-xxxhdpi/

      - name: Ensure INTERNET + RECORD_AUDIO permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's|</manifest>|    <uses-permission android:name="android.permission.INTERNET" />\n</manifest>|' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST"; then
            sed -i 's|</manifest>|    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n</manifest>|' "$MANIFEST"
          fi
          python3 - << 'PY'
from pathlib import Path
p = Path("android/app/src/main/AndroidManifest.xml")
text = p.read_text()
if "android.intent.action.SEND" not in text:
    snippet = """
            <intent-filter>
                <action android:name="android.intent.action.SEND" />
                <category android:name="android.intent.category.DEFAULT" />
                <data android:mimeType="text/plain" />
            </intent-filter>
            <intent-filter>
                <action android:name="android.intent.action.SEND" />
                <category android:name="android.intent.category.DEFAULT" />
                <data android:mimeType="image/*" />
            </intent-filter>
"""
    text = text.replace("</activity>", snippet + "        </activity>", 1)
    p.write_text(text)
PY

      - name: Usa la chiave di firma fissa (aggiornamenti senza disinstallare)
        run: |
          mkdir -p "$HOME/.android"
          cp resources/signing/miaai-debug.keystore "$HOME/.android/debug.keystore"

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mia-ai-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
