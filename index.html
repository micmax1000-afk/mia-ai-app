<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000" id="themeColor">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<title>Mia</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/app-fix.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button type="button" class="icon-btn" id="menuBtn" aria-label="Conversazioni"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <button type="button" class="title" id="modelBtn" aria-label="Cambia modello">
      <strong id="chatTitle">Mia</strong>
      <small id="modelHint">—</small>
    </button>
    <span id="netDot" class="net-dot" title="Connessione"></span>
    <button type="button" class="icon-btn" id="newChatBtn" aria-label="Nuova chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </header>

  <main id="messages" aria-live="polite">
    <div class="empty" id="emptyState">
      <h1>Mia</h1>
      <p>Come posso aiutarti?</p>
      <p class="hint" id="setupHint" hidden>Prima apri <button type="button" class="link" data-open-settings>Impostazioni</button> e scegli il provider AI.</p>
      <div class="suggestions">
        <button type="button" class="chip" data-prompt="Spiegami in modo semplice come funziona l'intelligenza artificiale">Come funziona l'intelligenza artificiale?</button>
        <button type="button" class="chip" data-prompt="Aiutami a scrivere una email cortese per chiedere un appuntamento">Scrivi una email</button>
        <button type="button" class="chip" data-prompt="Dammi 5 idee per una cena veloce con quello che ho in frigo: uova, zucchine, formaggio">Idee per una cena veloce</button>
      </div>
    </div>
  </main>

  <div class="pending-att" id="pendingAtt" hidden></div>
  <form class="composer" id="composer" autocomplete="off">
    <button type="button" class="attach-btn" id="attachBtn" aria-label="Allega file"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12.5l6.2-6.2a3 3 0 0 1 4.2 4.2l-7.4 7.5a4.2 4.2 0 0 1-6-6l6.8-6.8"/></svg></button>
    <button type="button" class="mic-btn" id="micBtn" aria-label="Microfono" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a2.5 2.5 0 0 1 2.5 2.5V12a2.5 2.5 0 0 1-5 0V6.5A2.5 2.5 0 0 1 12 4zM7 11v1a5 5 0 0 0 10 0v-1M12 17v3"/></svg></button>
    <input type="file" id="fileInput" multiple hidden
      accept="image/*,application/pdf,.pdf,text/*,.txt,.md,.csv,.json,.xml,.html,.css,.js,.ts,.py,.java,.kt,.c,.cpp,.go,.rs,.php,.sh,.sql,.yaml,.yml,.log,.srt">
    <textarea id="input" rows="1" placeholder="Chiedi a Mia" enterkeyhint="send"></textarea>
    <button type="submit" class="send-btn" id="sendBtn" aria-label="Invia">↑</button>
  </form>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <strong class="brand">Mia</strong>
  </div>
  <div style="padding:0 12px 8px">
    <button type="button" class="btn ghost full" id="drawerNew"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Nuova chat</button>
  </div>
  <ul class="conv-list" id="convList"></ul>
  <div class="drawer-foot">
    <button type="button" class="btn ghost full" data-open-settings>Impostazioni</button>
  </div>
</aside>

<div class="sheet" id="settings" hidden role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="sheet-card">
    <div class="sheet-head">
      <strong id="settingsTitle">Impostazioni</strong>
      <button type="button" class="icon-btn" id="closeSettings" aria-label="Chiudi">✕</button>
    </div>
    <div class="sheet-body">
      <label class="field">
        <span>Provider AI</span>
        <select id="provider"></select>
      </label>
      <p class="hint" id="providerHint"></p>

      <label class="field">
        <span>Indirizzo API (base URL)</span>
        <input id="baseUrl" type="url" inputmode="url" spellcheck="false" autocapitalize="off">
      </label>

      <label class="field">
        <span>Chiave API <small id="keyOptional">(facoltativa)</small></span>
        <div class="row">
          <input id="apiKey" type="password" spellcheck="false" autocapitalize="off" autocomplete="off">
          <button type="button" class="btn small ghost" id="toggleKey">👁</button>
        </div>
      </label>

      <label class="field">
        <span>Modello</span>
        <div class="row">
          <input id="model" spellcheck="false" autocapitalize="off" placeholder="Carica modelli">
          <button type="button" class="btn small ghost" id="loadModels">Carica</button>
        </div>
      </label>
      <p class="hint" id="modelsStatus"></p>
      <div class="model-browser" id="modelBrowser" hidden>
        <div class="row">
          <input id="modelSearch" type="search" placeholder="Cerca modello…" spellcheck="false" autocapitalize="off">
          <label class="toggle"><input type="checkbox" id="onlyFree"> Solo gratis</label>
        </div>
        <ul class="model-results" id="modelResults"></ul>
      </div>

      <label class="field">
        <span>Istruzioni di sistema</span>
        <textarea id="systemPrompt" rows="3"></textarea>
      </label>

      <label class="field">
        <span>Creatività: <b id="tempValue">0.7</b></span>
        <input id="temperature" type="range" min="0" max="1.5" step="0.1">
      </label>

      <label class="field check-field">
        <input type="checkbox" id="autoFallback">
        <span>Se il modello è occupato, prova gli altri dell'elenco</span>
      </label>

      <label class="field">
        <span>Tema</span>
        <select id="theme">
          <option value="auto">Automatico</option>
          <option value="dark">Scuro</option>
          <option value="light">Chiaro</option>
        </select>
      </label>

      <hr style="margin:16px 0;border:none;border-top:1px solid var(--border);">

      <label class="field">
        <span>Token GitHub</span>
        <div class="row">
          <input id="githubToken" type="password" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="ghp_…">
          <button type="button" class="btn small ghost" id="testGithub">Testa</button>
        </div>
        <p class="hint">Permesso <code>repo</code>. Resta solo su questo dispositivo.</p>
        <div class="gh-panel" id="ghPanel">
          <div class="row">
            <select id="ghRepo"><option value="">I miei repository…</option></select>
            <button type="button" class="btn small ghost" id="ghLoadRepos">Carica</button>
          </div>
          <button type="button" class="btn ghost" id="ghReview">Fai leggere il repository a Mia</button>
          <input id="ghPath" spellcheck="false" autocapitalize="off" placeholder="percorso, es. note/chat.md">
          <button type="button" class="btn ghost" id="ghExportChat">Esporta questa chat</button>
          <textarea id="ghFileBody" placeholder="Oppure scrivi qui un file da salvare sul repository"></textarea>
          <button type="button" class="btn ghost" id="ghPutFile">Salva file</button>
          <p class="hint" id="ghStatus"></p>
        </div>
      </label>

      <div class="danger">
        <button type="button" class="btn ghost" id="exportBtn">Esporta chat (JSON)</button>
        <button type="button" class="btn danger-btn" id="clearAll">Elimina tutte le chat</button>
      </div>
      <p class="hint">Chiavi e conversazioni restano solo su questo dispositivo. Chiudi per salvare.</p>
    </div>
  </div>
</div>

<div class="sheet" id="picker" hidden role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
  <div class="sheet-card">
    <div class="sheet-head">
      <strong id="pickerTitle">Scegli il modello</strong>
      <button type="button" class="icon-btn" id="closePicker" aria-label="Chiudi">✕</button>
    </div>
    <div class="sheet-body">
      <ul class="conv-list pick-list" id="pickerList"></ul>
      <button type="button" class="btn ghost full" data-open-settings>Aggiungi un modello</button>
      <p class="hint">Ogni modello che usi viene aggiunto qui.</p>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/markdown.js"></script>
<script src="js/providers.js"></script>
<script src="js/github.js"></script>
<script src="js/github-ui.js"></script>
<script src="js/app.js"></script>
<script src="js/app-fix.js"></script>
</body>
</html>
